name: Test formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - name: Register tap
        run: brew tap Ninian-Lemain/chaos-engineering "$GITHUB_WORKSPACE"
      - name: Install formula
        run: brew install Ninian-Lemain/chaos-engineering/chaos-engineering-rs
      - name: Verify binary
        run: chaos --version
      - name: Test formula
        run: brew test Ninian-Lemain/chaos-engineering/chaos-engineering-rs
